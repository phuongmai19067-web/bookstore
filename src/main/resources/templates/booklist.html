<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <meta charset="UTF-8">
    <title>Booklist</title>
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>

<body>
    <h1>Books</h1>

    <!-- e) Hiện tên người đang đăng nhập -->
    <p>Welcome <span sec:authentication="name">Name</span></p>

    <!-- d) Nút đăng xuất -->
    <form th:action="@{/logout}" method="post">
        <input type="submit" value="Sign Out" class="btn btn-sm btn-danger"/>
    </form>

    <table class="table table-striped">
        <tr>
            <th>Author</th>
            <th>Title</th>
            <th>ISBN</th>
            <th>Year</th>
            <th>Category</th>
            <th></th>
            <!-- f) Cột Delete chỉ ADMIN thấy -->
            <th sec:authorize="hasRole('ADMIN')"></th>
        </tr>
        <tr th:each="book : ${books}">
            <td th:text="${book.author}"></td>
            <td th:text="${book.title}"></td>
            <td th:text="${book.isbn}"></td>
            <td th:text="${book.publicationYear}"></td>
            <td th:text="${book.category != null ? book.category.name : ''}"></td>
            <td><a class="btn btn-primary" th:href="@{/edit/{id}(id=${book.id})}">Edit</a></td>
            <!-- f) Nút Delete chỉ ADMIN thấy -->
            <td sec:authorize="hasRole('ADMIN')">
                <a class="btn btn-danger" th:href="@{/delete/{id}(id=${book.id})}">Delete</a>
            </td>
        </tr>
    </table>
    <a class="btn btn-success" th:href="@{/add}">Add Book</a>
</body>

</html>
