# Khi chạy trên Render: dùng biến môi trường DATABASE_URL (PostgreSQL).
# Khi chạy ở máy local: không có biến đó nên tự dùng H2.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:bookdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# H2 console (chỉ dùng được khi chạy local với H2)
spring.h2.console.enabled=true